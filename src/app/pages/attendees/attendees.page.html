<ion-header class="ion-no-border page-header">
  <ion-toolbar>
    <ion-title>Attendees</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()" aria-label="Log out">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="page-content ef-floor-bg">
  <div class="directory-top">
    <div class="ef-shell ef-shell--wide">
      <ion-searchbar
        placeholder="Search name, company, industry"
        [debounce]="200"
        (ionInput)="onSearch($event.detail.value)"
      ></ion-searchbar>

      <div class="industry-row" role="list">
        <button
          type="button"
          class="industry-chip"
          role="listitem"
          [class.active]="industry() === 'all'"
          (click)="onIndustry('all')"
        >
          All
        </button>
        @for (item of industries(); track item) {
          <button
            type="button"
            class="industry-chip"
            role="listitem"
            [class.active]="industry() === item"
            (click)="onIndustry(item)"
          >
            {{ item }}
          </button>
        }
      </div>
    </div>
  </div>

  <div class="ef-shell ef-shell--wide attendee-list">
    @for (attendee of filtered(); track attendee.id) {
      <article
        class="attendee-card"
        [class.open]="expandedId() === attendee.id"
      >
        <button
          type="button"
          class="attendee-toggle"
          (click)="toggleExpand(attendee.id)"
          [attr.aria-expanded]="expandedId() === attendee.id"
        >
          <div class="attendee-copy">
            <h2>{{ attendee.name }}</h2>
            <p class="attendee-meta">
              {{ attendee.company }} · {{ attendee.industry }}
            </p>
          </div>
          <ion-icon
            [name]="expandedId() === attendee.id ? 'chevron-up-outline' : 'chevron-down-outline'"
            color="medium"
          ></ion-icon>
        </button>

        @if (expandedId() === attendee.id) {
          <div class="attendee-detail">
            <p class="bio">{{ attendee.bio }}</p>
            <ion-button size="small" (click)="requestMeeting(attendee)">
              Request meeting
            </ion-button>
          </div>
        }
      </article>
    } @empty {
      <p class="empty muted">No attendees match your filters.</p>
    }
  </div>
</ion-content>
