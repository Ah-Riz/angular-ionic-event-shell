<ion-header class="ion-no-border page-header">
  <ion-toolbar>
    <ion-title>Attendees</ion-title>
    <ion-buttons slot="end">
      <app-logout-button />
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="page-content ef-floor-bg">
  <div class="directory-top ef-enter">
    <div class="ef-shell ef-shell--wide">
      <ion-searchbar
        placeholder="Search name, company, industry"
        [debounce]="200"
        [value]="query()"
        (ionInput)="onSearch($event.detail.value)"
      ></ion-searchbar>

      <div class="industry-row" role="list">
        <button
          type="button"
          class="industry-chip"
          role="listitem"
          [class.active]="industry() === 'all'"
          (click)="onIndustry('all')"
        >
          All
        </button>
        @for (item of industries(); track item) {
          <button
            type="button"
            class="industry-chip"
            role="listitem"
            [class.active]="industry() === item"
            (click)="onIndustry(item)"
          >
            {{ item }}
          </button>
        }
      </div>
    </div>
  </div>

  @if (!ready()) {
    <div class="ef-shell ef-shell--wide skeleton-grid" aria-hidden="true">
      <div class="skel skel-card"></div>
      <div class="skel skel-card"></div>
      <div class="skel skel-card"></div>
      <div class="skel skel-card"></div>
    </div>
  } @else {
    <div class="ef-shell ef-shell--wide attendee-list">
      @for (attendee of filtered(); track attendee.id; let i = $index) {
        <button
          type="button"
          class="attendee-card ef-stagger"
          [style.--i]="i"
          (click)="openAttendee(attendee.id)"
        >
          <span class="avatar" [style.background]="attendee.avatarColor">
            {{ initials(attendee.name) }}
          </span>
          <span class="copy">
            <strong>{{ attendee.name }}</strong>
            <span class="role">{{ attendee.title }}</span>
            <span class="attendee-meta">
              {{ attendee.company }} · {{ attendee.industry }}
            </span>
          </span>
        </button>
      } @empty {
        <div class="empty-state">
          <p class="muted">No attendees match your filters.</p>
          <button type="button" class="text-action" (click)="clearFilters()">
            Clear filters
          </button>
        </div>
      }
    </div>
  }
</ion-content>
