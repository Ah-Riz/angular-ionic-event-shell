<ion-header>
  <ion-toolbar>
    <ion-title>Event Floor</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="login-content">
  <div class="login-panel">
    <p class="brand">Event Floor</p>
    <h1>Sign in to the conference</h1>
    <p class="muted">
      Demo login only — any email works. Password is unused.
    </p>

    <ion-list lines="full" class="login-form">
      <ion-item>
        <ion-input
          label="Email"
          labelPlacement="stacked"
          type="email"
          [(ngModel)]="email"
          autocomplete="email"
          required
        ></ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          label="Password (optional)"
          labelPlacement="stacked"
          type="password"
          [(ngModel)]="password"
          autocomplete="current-password"
        ></ion-input>
      </ion-item>
    </ion-list>

    <ion-button expand="block" (click)="submit()" [disabled]="!email.trim()">
      Enter conference
    </ion-button>
  </div>
</ion-content>
